name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage
        run: npm run test:unit

      - name: Build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests and coverage
        run: npm run test:unit

      - name: Build backend Docker image
        run: docker build -t connect-server:test .

  integration:
    name: API, Redis, and realtime integration
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://connect_test:connect_test_password@127.0.0.1:27017/connect_test?authSource=admin
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_KEY_PREFIX: connect:ci
      REDIS_CACHE_ENABLED: "true"
      EXPOSE_CACHE_HEADERS: "true"
      JWT_SECRET: connect-ci-test-only-secret
      CLIENT_URL: http://127.0.0.1:5174
    services:
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: connect_test
          MONGO_INITDB_ROOT_PASSWORD: connect_test_password
          MONGO_INITDB_DATABASE: connect_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username connect_test --password connect_test_password --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: API integration
        run: npm run test:integration
      - name: Redis integration
        run: npm run test:redis
      - name: Realtime integration
        run: npm run test:realtime

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://connect_test:connect_test_password@127.0.0.1:27017/connect_test?authSource=admin
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_KEY_PREFIX: connect:e2e
      REDIS_CACHE_ENABLED: "true"
      EXPOSE_CACHE_HEADERS: "true"
      JWT_SECRET: connect-ci-test-only-secret
      CLIENT_URL: http://127.0.0.1:5174
      CLIENT_URLS: http://127.0.0.1:5174,http://localhost:5174
    services:
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: connect_test
          MONGO_INITDB_ROOT_PASSWORD: connect_test_password
          MONGO_INITDB_DATABASE: connect_test
        ports:
          - 27017:27017
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Install test runner
        run: npm ci
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - name: Run E2E regressions
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy-render:
    name: Deploy Render
    runs-on: ubuntu-latest
    needs:
      - client
      - server
      - integration
      - e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "RENDER_DEPLOY_HOOK_URL is not configured; relying on Render auto-deploy."
